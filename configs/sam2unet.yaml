model:
  name: sam2unet
  n_channels: 3
  n_classes: 2
  encoder_type: vitb16     # vitb16 (default) | sam2 (requires pip install sam2 + weights)
  img_size: 512
  freeze_encoder: true
  pretrained: true
  sam2_weights: null       # /path/to/sam2_hiera_large.pt — only for encoder_type: sam2

dataset:
  images_dir: /data_64T_3/Raja/CDH1/src_segmentation/dataset_augmentation/2.original_augmented_dataset_combined/patches
  masks_dir:  /data_64T_3/Raja/CDH1/src_segmentation/dataset_augmentation/2.original_augmented_dataset_combined/masks
  split_csv_dir: splits/dataset_augmented/split_train_val_test
  # split_csv: splits/dataset_augmented/split_train_val_test/fold1.csv

  img_size: [512, 512]
  num_workers: 4
  augment: true
  val_split: 0.16
  test_split: 0.2

training:
  fold_mode: kfold
  n_folds: 5
  seed: 42
  eval_mode: train_val_test
  epochs: 200
  batch_size: 2
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  amp: true
  early_stopping_patience: 35
  loss: dice_ce

optimizer:
  name: adam
  momentum: 0.9

scheduler:
  name: cosine
  step_size: 30
  gamma: 0.1
  min_lr: 1.0e-6

logging:
  log_dir: logs/sam2unet
  log_interval: 10
